{% extends "base.html" %}

{% block content %}

<div class="auth-box">

    <div class="auth-icon">
        📝
    </div>

    <p class="quiz-label">
        QUIZMASTER
    </p>

    <h1>
        Create Account
    </h1>

    <p>
        Join QuizMaster and start testing your skills.
    </p>


    <form method="POST">

        <label>
            Full Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label>
            Email Address
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
        >


        <button type="submit">
            Create Account →
        </button>

    </form>


    <p class="auth-footer">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

{% endblock %}
